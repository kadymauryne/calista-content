name: Publier sur Instagram

on:
  schedule:
    - cron: "7 * * * *"      # toutes les heures, à la minute 7
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier les posts dont l'heure est passée
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/publish.py
      - name: Enregistrer l'état (publié / échec)
        if: always()
        run: |
          git config user.name "calista-bot"
          git config user.email "calista-bot@users.noreply.github.com"
          git add queue/posts.json
          git diff --cached --quiet || (git commit -m "Mise à jour de la file de publication" && git push)
