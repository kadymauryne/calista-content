name: Publier sur Instagram

on:
  schedule:
    - cron: "7,27,47 * * * *"   # toutes les 20 minutes (GitHub saute parfois des passages)
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Installer ffmpeg si absent (montage des réels)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Publier les posts dont l'heure est passée
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/publish.py
      - name: Enregistrer l'état (publié / échec)
        if: always()
        run: |
          git config user.name "calista-bot"
          git config user.email "calista-bot@users.noreply.github.com"
          git add -A queue videos
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour de la file de publication"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
