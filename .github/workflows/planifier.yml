name: Planifier la semaine

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test à blanc (n'écrit rien) : 1 = oui, 0 = non"
        default: "0"
  schedule:
    - cron: "0 20 * * 0"     # chaque dimanche à 20 h (heure d'Abidjan = UTC)

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  planifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Choisir les prompts de la semaine
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 scripts/plan_week.py
      - name: Enregistrer le planning
        run: |
          git config user.name "calista-bot"
          git config user.email "calista-bot@users.noreply.github.com"
          git add queue images
          git diff --cached --quiet && exit 0
          git commit -m "Planning de la semaine"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
